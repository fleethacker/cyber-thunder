# Cyber Thunder range: unattended Rocky Linux 9 install for acd-target-01.
#
# This is a TEMPLATE. new-range-vm.ps1 replaces the two @-delimited placeholders with
# values from range/.local/range.env (untracked) and writes the result onto a small
# ISO labelled OEMDRV, which Anaconda picks up automatically for a hands-off install.
#
# Disposable, isolated range only. Never boot this against, or on, a real network.

text
cdrom
# The minimal ISO carries BaseOS only, so podman and open-vm-tools (AppStream) are not on it.
# Pull the AppStream packages from the online repos over the NAT link; BaseOS still comes from the
# disc. These repos are used only during install (no --install), so the built system keeps the
# default Rocky repo files.
repo --name=rl-baseos --baseurl=https://download.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/
repo --name=rl-appstream --baseurl=https://download.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/
eula --agreed
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone Etc/UTC --utc

# One NIC, DHCP (NAT on VMnet8), fixed hostname the seed scripts check for.
network --bootproto=dhcp --device=link --activate --hostname=acd-target-01

# Root is locked. acd is the administrator and the Cyber Thunder scan account.
rootpw --lock
user --name=acd --groups=wheel --iscrypted --password=@@ACD_PWHASH@@
# The scan key goes straight into acd's authorized_keys: no password on the wire.
sshkey --username=acd "@@SSH_PUBKEY@@"

# Wipe and auto-partition the single NVMe disk. On EFI, autopart makes the ESP.
ignoredisk --only-use=nvme0n1
clearpart --all --initlabel --drives=nvme0n1
autopart --type=lvm --nohome
bootloader --location=mbr --boot-drive=nvme0n1

firstboot --disable
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,chronyd

# Minimal baseline plus exactly what the Linux, container and SCAP areas need.
# All of these are on the Rocky 9 minimal ISO, so the install needs no network.
%packages
@^minimal-environment
openscap-scanner
scap-security-guide
openssh-server
python3
tar
podman
open-vm-tools
%end

# Passwordless, terminal-less sudo for the scan account (so `sudo -n` works over SSH),
# then lock the drop-in down to 0440 as sudo requires.
%post --log=/root/ks-post.log
set -euxo pipefail
install -d -m 0750 /etc/sudoers.d
cat > /etc/sudoers.d/acd <<'SUDO'
acd ALL=(ALL) NOPASSWD: ALL
Defaults:acd !requiretty
SUDO
chmod 0440 /etc/sudoers.d/acd
systemctl enable sshd chronyd
%end

# Power the VM off when the install finishes. new-range-vm.ps1 then detaches the
# install media and boots a clean system for the SSH check and the `clean` snapshot.
poweroff --eject
