apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: podinfo
  namespace: podinfo
spec:
  network:
    serviceMesh:
      mode: sidecar
    expose:
      - service: podinfo
        selector:
          app.kubernetes.io/name: podinfo
        gateway: tenant
        host: podinfo
        port: 9898
  sso:
    - name: Podinfo SSO
      clientId: cyber-thunder-podinfo
      redirectUris:
        - https://podinfo.###ZARF_VAR_DOMAIN###/login
      enableAuthserviceSelector:
        app.kubernetes.io/name: podinfo
      groups:
        anyOf:
          - /UDS Core/Admin
  monitor:
    - selector:
        app.kubernetes.io/name: podinfo
      targetPort: 9797
      portName: http-metrics
      description: Podinfo metrics.
      kind: PodMonitor
