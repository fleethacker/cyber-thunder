image:
  repository: ghcr.io/stefanprodan/podinfo
  # The chart renders repository:tag; the digest fixes the image behind the readable release tag.
  tag: 6.10.1@sha256:f107b0acc7f9350212571d8eb223ec004f6e20cf22083fc19b112280278827c9

securityContext:
  allowPrivilegeEscalation: false
