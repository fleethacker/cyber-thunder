kind: ZarfPackageConfig
metadata:
  name: cyberthunder
  description: Cyber Thunder cluster survey and image risk assessment with UDS ingress, Keycloak SSO, and persistent state.
  version: 0.2.6

variables:
  - name: DOMAIN
    description: Domain used by UDS Core and Cyber Thunder SSO.
    default: uds.dev

  - name: SCAN_TARGET_CIDR
    description: Approved SSH target address or subnet. Set a real /32 to enable VM access.
    default: 192.0.2.1/32

  - name: SCAN_SSH_PORT
    description: SSH destination port, including a host-forwarded port for a local VM.
    default: "22"

components:
  - name: uds-integration
    required: true
    manifests:
      - name: cyberthunder-uds-config
        namespace: cyberthunder
        files:
          - uds.yaml
    actions:
      onDeploy:
        after:
          - description: Wait for ingress and SSO configuration before starting Cyber Thunder.
            cmd: ./zarf tools kubectl wait package/cyberthunder -n cyberthunder --for=jsonpath='{.status.phase}'=Ready --timeout=300s
  - name: cyberthunder
    required: true
    manifests:
      - name: cyberthunder
        namespace: cyberthunder
        files:
          - ../../deploy/kubernetes/cyberthunder.yaml
    images:
      - cyberthunder:0.2.6
