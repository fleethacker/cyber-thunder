apiVersion: v1
kind: Namespace
metadata:
  name: cyberthunder
---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: cyberthunder
  namespace: cyberthunder
spec:
  network:
    serviceMesh:
      mode: sidecar
    allow:
      - direction: Egress
        selector:
          app: cyberthunder
        remoteGenerated: KubeAPI
        description: Read cluster namespaces and workloads for the cluster survey.
      - direction: Egress
        selector:
          app: cyberthunder
        remoteCidr: "###ZARF_VAR_SCAN_TARGET_CIDR###"
        port: ###ZARF_VAR_SCAN_SSH_PORT###
        remoteProtocol: TCP
        description: SSH to the approved VM range.
      - direction: Egress
        selector:
          app: cyberthunder
        remoteNamespace: keycloak
        remoteSelector:
          app.kubernetes.io/name: keycloak
        port: 8080
        description: Fetch Keycloak signing keys to verify SSO access tokens.
    expose:
      - service: cyberthunder
        selector:
          app: cyberthunder
        gateway: tenant
        host: cyberthunder
        port: 80
        targetPort: 8000
  sso:
    - name: Cyber Thunder
      clientId: cyber-thunder-app
      redirectUris:
        - https://cyberthunder.###ZARF_VAR_DOMAIN###/login
      enableAuthserviceSelector:
        app: cyberthunder
      groups:
        anyOf:
          - /UDS Core/Admin
