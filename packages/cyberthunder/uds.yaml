apiVersion: v1
kind: Namespace
metadata:
  name: cyberthunder
---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: cyberthunder
  namespace: cyberthunder
spec:
  network:
    serviceMesh:
      mode: sidecar
    allow:
      - description: Kubernetes API access for cluster survey
        direction: Egress
        selector:
          app.kubernetes.io/name: cyberthunder
        remoteGenerated: KubeAPI
      - description: OpenAI API access for optional risk profile summaries
        direction: Egress
        port: 443
        remoteHost: api.openai.com
        remoteProtocol: TLS
        selector:
          app.kubernetes.io/name: cyberthunder
        serviceAccount: cyberthunder
    expose:
      - service: cyberthunder
        selector:
          app.kubernetes.io/name: cyberthunder
        gateway: tenant
        host: cyberthunder
        port: 8000
