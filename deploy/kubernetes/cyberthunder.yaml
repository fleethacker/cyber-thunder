apiVersion: v1
kind: Namespace
metadata:
  name: cyberthunder
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cyberthunder-state
  namespace: cyberthunder
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberthunder
  namespace: cyberthunder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cyberthunder
  template:
    metadata:
      labels:
        app: cyberthunder
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cyberthunder
          image: cyberthunder:0.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CT_STATE_DIR
              value: /var/lib/cyberthunder
            - name: CT_LLM_BACKEND
              value: template
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: state
              mountPath: /var/lib/cyberthunder
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: cyberthunder-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cyberthunder
  namespace: cyberthunder
spec:
  selector:
    app: cyberthunder
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
