apiVersion: v1
kind: Namespace
metadata:
  name: cyberthunder
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyberthunder
  namespace: cyberthunder
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cyberthunder-survey
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, serviceaccounts, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, rolebindings]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cyberthunder-survey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cyberthunder-survey
subjects:
  - kind: ServiceAccount
    name: cyberthunder
    namespace: cyberthunder
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cyberthunder-kubeconfig
  namespace: cyberthunder
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: cyberthunder
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: cyberthunder
    current-context: in-cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cyberthunder-state
  namespace: cyberthunder
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberthunder
  namespace: cyberthunder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cyberthunder
  template:
    metadata:
      labels:
        app: cyberthunder
        app.kubernetes.io/name: cyberthunder
    spec:
      serviceAccountName: cyberthunder
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Administrators provision PVC ownership; fsGroup would make policy ancestors group-writable.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cyberthunder
          image: cyberthunder:0.2.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cyberthunder-identity
                optional: false
          env:
            - name: CT_HOST
              value: 0.0.0.0
            - name: CT_PORT
              value: "8000"
            - name: CT_SECURITY_MODE
              value: fleet
            - name: CT_OIDC_CLIENT_SECRET_REF
              value: BROWSER_LOGIN
            - name: CT_CRED_BROWSER_LOGIN
              valueFrom:
                secretKeyRef:
                  name: cyberthunder-oidc-client
                  key: client-secret
                  optional: false
            - name: CT_STATE_DIR
              value: /var/lib/cyberthunder
            - name: CT_LLM_BACKEND
              value: template
            - name: CT_BOOTSTRAP_CLUSTER_TARGET
              value: "true"
            - name: CT_BOOTSTRAP_CLUSTER_TARGET_ID
              value: local-cluster
            - name: CT_BOOTSTRAP_CLUSTER_NAME
              value: Local Kubernetes cluster
            - name: CT_BOOTSTRAP_CLUSTER_KUBECONFIG
              value: /etc/cyberthunder/kubeconfig
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: application-tls
              mountPath: /etc/cyberthunder-tls
              readOnly: true
            - name: target-credentials
              mountPath: /etc/cyberthunder/targets
              readOnly: true
            - name: state
              mountPath: /var/lib/cyberthunder
            - name: tmp
              mountPath: /tmp
            - name: kubeconfig
              mountPath: /etc/cyberthunder
              readOnly: true
            - name: cluster-credentials
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      initContainers:
        - name: identity-preflight
          image: cyberthunder:0.2.6
          imagePullPolicy: IfNotPresent
          command: [python, /etc/package-identity/validate.py]
          envFrom:
            - configMapRef:
                name: cyberthunder-identity
                optional: false
          env:
            - name: CT_OIDC_CLIENT_SECRET_REF
              value: BROWSER_LOGIN
            - name: CT_STATE_DIR
              value: /var/lib/cyberthunder
            - name: CT_HOST
              value: 0.0.0.0
            - name: CT_SECURITY_MODE
              value: fleet
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/cyberthunder
              readOnly: true
            - name: identity-preflight
              mountPath: /etc/package-identity
              readOnly: true
      volumes:
        - name: identity-preflight
          configMap:
            name: cyberthunder-identity-preflight
        - name: application-tls
          secret:
            secretName: cyberthunder-tls
            # Native OIDC requires these files. The UDS mesh profile terminates TLS at its gateway.
            optional: true
            defaultMode: 0444
        - name: target-credentials
          secret:
            secretName: cyberthunder-target-credentials
            optional: true
            defaultMode: 0444
        - name: state
          persistentVolumeClaim:
            claimName: cyberthunder-state
        - name: tmp
          emptyDir: {}
        - name: kubeconfig
          configMap:
            name: cyberthunder-kubeconfig
        - name: cluster-credentials
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: cyberthunder
  namespace: cyberthunder
spec:
  selector:
    app: cyberthunder
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
