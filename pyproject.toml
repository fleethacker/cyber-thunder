[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberthunder"
version = "0.2.0"
description = "Cyber Thunder: find, explain and fix misconfigurations and vulnerabilities on isolated networks, with a human approving every change."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "paramiko>=3.4",
  "pywinrm>=0.4",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cyberthunder = "cyberthunder.cli:main"

[tool.setuptools.packages.find]
include = ["cyberthunder*"]

[tool.setuptools.package-data]
cyberthunder = ["report/templates/*.j2", "adapters/*/stig_rules.json", "adapters/windows/*.json", "adapters/windows/ps/*.ps1", "ingest/data/*.json", "ui/dist/*", "ui/dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
