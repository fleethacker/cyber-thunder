name: Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }}, JSON + SQLite)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      CT_STATE_BACKENDS: json,sqlite
      CT_TEST_LLM: '0'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GATE_TEST_CMD: python scripts/ci_pytest.py
    steps:
      - name: Check out the tested revision with gate history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check committed whitespace before generating UI assets
        run: git show --check --format= HEAD

      - name: Install UI dependencies from the lockfile
        working-directory: cyberthunder/ui
        run: npm ci --no-audit --no-fund

      - name: Build the UI and typecheck
        working-directory: cyberthunder/ui
        run: npm run build

      - name: Run UI regressions
        working-directory: cyberthunder/ui
        run: npm test

      - name: Run the normal gate with strict full-suite skip checks
        if: ${{ !cancelled() }}
        run: bash scripts/gate.sh

      - name: Preserve test and skip-policy reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-${{ matrix.os }}
          path: |
            .build/ci/pytest.xml
            .build/ci/policy.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
